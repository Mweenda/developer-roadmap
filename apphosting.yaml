# Firebase App Hosting — the Node/Express process (frontend + /api).
# Do not replace this with static-only Hosting.
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: HOST
    value: 0.0.0.0
    availability:
      - RUNTIME
  - variable: FIELDNOTES_DATA
    value: firestore
    availability:
      - RUNTIME
